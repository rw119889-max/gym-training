<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#08090b" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f7f8f4" media="(prefers-color-scheme: light)">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="自律更自由">
  <title>自律更自由</title>
  <meta
    name="description"
    content="自律更自由：本地优先的健身训练记录应用。动作视频照片文章归位、心得笔记、按餐次记录食谱并自动求和营养，离线可用，不上传服务器。"
  >
  <script>
    // 首帧前解析主题（含「跟随系统」），避免浅色用户看到一帧深色闪白。
    // 浅色主题在 CSS 里只有 [data-theme="light"] 一个来源，必须落属性。
    (function () {
      try {
        var raw = localStorage.getItem('gt.v1.themeMode')
        var mode = raw ? JSON.parse(raw) : 'auto'
        if (mode !== 'light' && mode !== 'dark') {
          mode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
        }
        document.documentElement.setAttribute('data-theme', mode)
      } catch (e) {}
    })()
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
