  <meta name="theme-color" content="#f7f8f4" media="(prefers-color-scheme: light)">

  <link rel="icon" href="./icons/icon-192.png" type="image/png">

  <meta name="apple-mobile-web-app-title" content="自律更自由">
  <title>自律更自由</title>
  <script>
    // 首帧前套用强制主题，避免浅色用户看到一帧深色闪白
    (function () {
      try {
        var raw = localStorage.getItem('gt.v1.themeMode')
        var mode = raw ? JSON.parse(raw) : 'auto'
        if (mode === 'light' || mode === 'dark') {
          document.documentElement.setAttribute('data-theme', mode)
        }
      } catch (e) {}
    })()
  </script>
