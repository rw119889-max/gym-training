<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>训练计划 · 翻页卡片</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#efece6;
    --ink:#1c1b18;
    --ink-2:#6f6b62;
    --ink-3:#8a8478;
    --line:#f1ede3;
    --accent:#b05227;
    --curve:cubic-bezier(0.22,1,0.36,1);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--bg);
    font-family:'Manrope','PingFang SC','Microsoft YaHei',sans-serif;
    color:var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:40px;
    min-height:100vh;
    padding:48px 24px;
    -webkit-font-smoothing:antialiased;
  }
  .caption-top{
    font-size:12px;line-height:16px;font-weight:600;
    letter-spacing:.14em;color:var(--ink-3);
  }

  /* ===== 舞台与底层纸 ===== */
  .stage{
    position:relative;
    width:min(400px,calc(100vw - 48px));
    height:560px;
    perspective:1800px;
  }
  .under{
    position:absolute;inset:0;border-radius:16px;
  }
  .under.u2{
    transform:translateY(22px) scale(.955);
    background:#ded9cc;
    box-shadow:0 16px 32px rgba(31,28,22,.12);
  }
  .under.u1{
    transform:translateY(10px) scale(.978);
    background:#ece8de;
    box-shadow:0 10px 24px rgba(31,28,22,.10);
  }

  /* ===== 当前页 ===== */
  .sheet{
    position:absolute;inset:0;
    background:#ffffff;
    border-radius:16px;
    padding:32px;
    display:flex;flex-direction:column;
    box-shadow:0 1px 2px rgba(31,28,22,.08),0 20px 44px rgba(31,28,22,.16);
    z-index:2;
    transform-origin:left center;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
  }
  /* 翻页时的明暗过渡（模拟纸面受光变化） */
  .sheet::before{
    content:'';
    position:absolute;inset:0;border-radius:16px;
    background:linear-gradient(90deg,rgba(28,26,21,.30),rgba(28,26,21,0) 65%);
    opacity:0;pointer-events:none;z-index:5;
  }
  .sheet.turn-r::before{
    background:linear-gradient(270deg,rgba(28,26,21,.30),rgba(28,26,21,0) 65%);
  }
  .sheet.leave-next::before,.sheet.leave-prev::before{
    animation:shadeOn .44s var(--curve) forwards;
  }
  @keyframes shadeOn{to{opacity:1}}

  /* ===== 右下大卷角（弧形翻折） ===== */
  .corner{
    position:absolute;right:0;bottom:0;
    width:170px;height:170px;
    z-index:6;
    overflow:hidden;
    border-radius:0 0 16px 0;
    pointer-events:none;
  }
  .corner svg{display:block}

  /* ===== 翻页动画 ===== */
  .sheet.leave-next{
    transform-origin:left center;
    animation:outNext .44s var(--curve) forwards;
  }
  .sheet.leave-prev{
    transform-origin:right center;
    animation:outPrev .44s var(--curve) forwards;
  }
  @keyframes outNext{
    0%{transform:rotateY(0);opacity:1}
    55%{opacity:1}
    100%{transform:rotateY(-92deg);opacity:0}
  }
  @keyframes outPrev{
    0%{transform:rotateY(0);opacity:1}
    55%{opacity:1}
    100%{transform:rotateY(92deg);opacity:0}
  }
  .sheet.enter-next{
    transform-origin:left center;
    animation:settleNext .5s var(--curve) both;
  }
  .sheet.enter-prev{
    transform-origin:right center;
    animation:settlePrev .5s var(--curve) both;
  }
  @keyframes settleNext{
    0%{transform:rotateY(-9deg) scale(.98);opacity:0}
    35%{opacity:1}
    100%{transform:rotateY(0) scale(1);opacity:1}
  }
  @keyframes settlePrev{
    0%{transform:rotateY(9deg) scale(.98);opacity:0}
    35%{opacity:1}
    100%{transform:rotateY(0) scale(1);opacity:1}
  }
  @media (prefers-reduced-motion:reduce){
    .sheet.leave-next{animation:fadeOnly .3s both}
    .sheet.leave-prev{animation:fadeOnly .3s both}
    .sheet.enter-next{animation:fadeIn .3s both}
    .sheet.enter-prev{animation:fadeIn .3s both}
    .sheet.leave-next::before,.sheet.leave-prev::before{animation:none}
  }
  @keyframes fadeOnly{to{opacity:0}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}

  /* ===== 页内排版 ===== */
  .page-head{
    display:flex;justify-content:space-between;align-items:flex-start;
  }
  .kicker{
    font-size:12px;line-height:16px;font-weight:600;
    letter-spacing:.14em;color:var(--accent);
  }
  .page-title{
    font-size:24px;line-height:32px;font-weight:700;
    margin-top:8px;
    text-wrap:balance;
  }
  .page-no{
    font-size:12px;line-height:16px;font-weight:600;
    color:#c2bcae;
    font-variant-numeric:tabular-nums;
    padding-top:2px;
  }
  .divider{
    height:1px;background:#efe9dc;
    margin:12px 0 2px;
  }
  .rows{display:flex;flex-direction:column}
  .row{
    display:flex;justify-content:space-between;align-items:flex-start;
    gap:16px;
    padding:10px 0;
    border-bottom:1px solid var(--line);
  }
  .row:last-child{border-bottom:none}
  .row-name{font-size:14px;line-height:20px;font-weight:600}
  .row-note{
    font-size:12px;line-height:16px;font-weight:400;
    color:var(--ink-3);margin-top:2px;
  }
  .row-sets{
    font-size:14px;line-height:20px;font-weight:500;
    color:var(--ink-2);
    white-space:nowrap;
    font-variant-numeric:tabular-nums;
    padding-top:2px;
  }
  .tip{
    margin-top:auto;
    background:#f7f4ed;
    border-radius:8px;
    padding:14px 16px;
    display:flex;flex-direction:column;gap:6px;
  }
  .tip-label{
    font-size:12px;line-height:16px;font-weight:600;
    letter-spacing:.14em;color:var(--accent);
  }
  .tip-text{
    font-size:14px;line-height:20px;font-weight:400;
    color:var(--ink-2);
    text-wrap:pretty;
  }

  /* ===== 页内分页（纸面底部） ===== */
  .sheet-foot{
    margin-top:10px;
    display:flex;justify-content:space-between;align-items:center;
  }
  .nav{
    font-family:inherit;
    font-size:14px;line-height:20px;font-weight:600;
    background:none;border:none;cursor:pointer;
    color:var(--ink);
    padding:8px 4px;
    border-radius:4px;
    transition:opacity .3s var(--curve),transform .3s var(--curve);
  }
  .nav:hover:not(:disabled){opacity:.6}
  .nav:active:not(:disabled){transform:scale(.98)}
  .nav:disabled{opacity:.3;cursor:default}
  .nav:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .count{
    font-size:14px;line-height:20px;font-weight:500;
    color:var(--ink-2);
    font-variant-numeric:tabular-nums;
    min-width:48px;text-align:center;
  }
  .hint{
    font-size:12px;line-height:16px;font-weight:400;
    color:#a49e90;
  }
</style>
</head>
<body>

  <div class="caption-top">健身科普 · 训练计划</div>

  <div class="stage" id="stage">
    <div class="under u2"></div>
    <div class="under u1"></div>

    <article class="sheet" id="sheet">
      <div class="page-head">
        <div>
          <div class="kicker" id="pKicker"></div>
          <h2 class="page-title" id="pTitle"></h2>
        </div>
        <div class="page-no" id="pNo"></div>
      </div>
      <div class="divider"></div>
      <div class="rows" id="pRows"></div>
      <div class="tip">
        <span class="tip-label" id="pTipLabel"></span>
        <p class="tip-text" id="pTipText"></p>
      </div>

      <footer class="sheet-foot">
        <button class="nav" id="prevBtn">上一页</button>
        <div class="count" id="count">1 / 4</div>
        <button class="nav" id="nextBtn">下一页</button>
      </footer>

      <div class="corner" aria-hidden="true">
        <svg width="170" height="170" viewBox="0 0 170 170">
          <defs>
            <linearGradient id="underG" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#f0ede6"/>
              <stop offset="0.45" stop-color="#ddd7c9"/>
              <stop offset="1" stop-color="#c9c2b0"/>
            </linearGradient>
            <linearGradient id="flapG" x1="0" y1="1" x2="1" y2="0">
              <stop offset="0" stop-color="#efeae0"/>
              <stop offset="0.45" stop-color="#fdfcf9"/>
              <stop offset="0.78" stop-color="#f4f1ea"/>
              <stop offset="1" stop-color="#e3ddd0"/>
            </linearGradient>
            <filter id="flapShadow" x="-30%" y="-30%" width="160%" height="160%">
              <feDropShadow dx="6" dy="6" stdDeviation="7" flood-color="#1f1c16" flood-opacity="0.28"/>
            </filter>
            <filter id="creaseBlur" x="-40%" y="-40%" width="180%" height="180%">
              <feGaussianBlur stdDeviation="7"/>
            </filter>
          </defs>
          <!-- 露出的底层纸面 -->
          <path d="M170 0 Q116 116 0 170 L170 170 Z" fill="url(#underG)"/>
          <!-- 折痕投影（落在底层纸面上） -->
          <path d="M170 0 Q116 116 0 170" fill="none" stroke="#1f1c16" stroke-opacity="0.16" stroke-width="12" filter="url(#creaseBlur)"/>
          <!-- 翻折的纸页（弧形卷边） -->
          <path d="M0 170 Q116 116 170 0 Q30 30 0 170 Z" fill="url(#flapG)" filter="url(#flapShadow)"/>
        </svg>
      </div>
    </article>
  </div>

  <div class="hint">支持键盘 ← → 翻页</div>

<script>
  const pages = [
    {
      kicker: '训练计划 · 总览',
      title: '推 · 拉 · 腿 · 休',
      rows: [
        ['推日', '胸 · 肩 · 三头', '每周 1 次'],
        ['拉日', '背 · 二头 · 核心', '每周 1 次'],
        ['腿日', '股四 · 腘绳 · 臀', '每周 1 次'],
        ['休息日', '散步 · 拉伸 · 睡眠', '循环推进'],
      ],
      tip: '渐进超负荷：同组数下 RPE ≤ 7 且全组完成，下次加重 2.5 kg。热身组不计入训练容量。'
    },
    {
      kicker: '第一天 · PUSH',
      title: '推日 · 胸肩三头',
      rows: [
        ['平板卧推', '杠铃 · 肩胛后收下沉', '4 × 6–8'],
        ['坐姿哑铃推举', '核心收紧 不挺腰', '3 × 8–10'],
        ['上斜哑铃卧推', '上胸发力 顶端挤压', '3 × 10–12'],
        ['哑铃侧平举', '肘微屈 想象手肘带路', '3 × 12–15'],
        ['绳索三头下压', '大臂贴身 全程锁定', '3 × 12–15'],
      ],
      tip: '组间休息 90–120 秒，卧推等大动作可延长至 150 秒。离心下放控制 2 秒，顶峰不锁死关节。'
    },
    {
      kicker: '第二天 · PULL',
      title: '拉日 · 背与二头',
      rows: [
        ['高位下拉', '沉肩 肘向下向后', '4 × 8–10'],
        ['坐姿划船', '躯干稳定 挤压肩胛', '3 × 10–12'],
        ['单臂哑铃划船', '不转体 手肘贴肋', '3 × 10–12'],
        ['绳索面拉', '强化外旋 稳定肩关节', '3 × 12–15'],
        ['哑铃弯举', '大臂固定 不甩重', '3 × 10–12'],
      ],
      tip: '背部发力感：先沉肩，想象「肘部画弧」把重量带回来，而不是用手拉。感受比重量更重要。'
    },
    {
      kicker: '第三天 · LEGS',
      title: '腿日 · 下肢与臀',
      rows: [
        ['杠铃深蹲', '髋膝同步 膝与脚尖同向', '4 × 6–8'],
        ['倒蹬', '全脚掌踩实 腰贴靠背', '3 × 10–12'],
        ['罗马尼亚硬拉', '髋铰链 背部平直', '3 × 8–10'],
        ['箭步蹲', '重心垂直下降', '3 × 10 每侧'],
        ['站姿提踵', '顶端停 1 秒', '3 × 15–20'],
      ],
      tip: '腿日后安排休息日。DOMS 通常在 24–72 小时达到峰值，轻度活动比完全静卧恢复更快。'
    },
  ];

  const sheet   = document.getElementById('sheet');
  const pKicker = document.getElementById('pKicker');
  const pTitle  = document.getElementById('pTitle');
  const pNo     = document.getElementById('pNo');
  const pRows   = document.getElementById('pRows');
  const pTipText= document.getElementById('pTipText');
  const countEl = document.getElementById('count');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');

  let idx = 0;
  let busy = false;

  function paint() {
    const p = pages[idx];
    pKicker.textContent = p.kicker;
    pTitle.textContent  = p.title;
    pNo.textContent     = String(idx + 1).padStart(2, '0');
    pTipText.textContent = p.tip;
    pRows.innerHTML = p.rows.map(r =>
      '<div class="row">' +
        '<div><div class="row-name">' + r[0] + '</div>' +
        '<div class="row-note">' + r[1] + '</div></div>' +
        '<div class="row-sets">' + r[2] + '</div>' +
      '</div>'
    ).join('');
    countEl.textContent = (idx + 1) + ' / ' + pages.length;
    prevBtn.disabled = idx === 0;
    nextBtn.disabled = idx === pages.length - 1;
  }

  function turn(dir) {
    if (busy) return;
    const t = idx + dir;
    if (t < 0 || t >= pages.length) return;
    busy = true;
    sheet.classList.add(dir > 0 ? 'leave-next' : 'leave-prev');
    setTimeout(() => {
      idx = t;
      paint();
      sheet.classList.remove('leave-next', 'leave-prev');
      void sheet.offsetWidth; /* 强制 reflow，确保入场动画生效 */
      sheet.classList.add(dir > 0 ? 'enter-next' : 'enter-prev');
      setTimeout(() => {
        sheet.classList.remove('enter-next', 'enter-prev');
        busy = false;
      }, 520);
    }, 450);
  }

  prevBtn.addEventListener('click', () => turn(-1));
  nextBtn.addEventListener('click', () => turn(1));
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft')  turn(-1);
    if (e.key === 'ArrowRight') turn(1);
  });

  paint();
</script>
</body>
</html>
